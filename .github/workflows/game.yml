name: Build and test Tycoon WAHH AIR
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble full offline music
        run: python3 scripts/assemble_audio.py
      - name: Test simulation and music
        run: |
          node tests/engine.test.cjs
          node tests/service.test.cjs
          node tests/music.test.cjs
      - name: Install browser test tools
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test game interface and capture screens
        run: npm run test:ui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test native music order
        run: |
          javac -d /tmp/music-tests app/src/main/java/com/wahhair/tycoon/MusicSequence.java tests/MusicSequenceTest.java
          java -cp /tmp/music-tests MusicSequenceTest
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore game signing key
        uses: actions/cache@v4
        with:
          path: signing/game.keystore
          key: wahh-tycoon-v11-signing
      - name: Ensure explicit signing key
        run: |
          mkdir -p signing
          if [ ! -f signing/game.keystore ]; then
            keytool -genkeypair -keystore signing/game.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=WAHH AIR Tycoon" -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -exportcert -keystore signing/game.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1 > signing/expected.txt
      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > qa/signature.txt
          grep -F -f signing/expected.txt qa/signature.txt
          grep -F c207a3232b17947e87025529edb096bfbd47f5497bf52794a35d3cbba3102db3 qa/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > qa/apk-package.txt
          cp app/build/outputs/apk/debug/app-debug.apk qa/Tycoon-WAHH-AIR-v2.0.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tycoon-WAHH-AIR
          path: qa/
          if-no-files-found: warn
