plugins { id 'com.android.application' }
android {
 namespace 'com.wahhair.tycoon'
 compileSdk 35
 androidResources { noCompress += ['mp3', 'm4a'] }
 defaultConfig { applicationId 'com.wahhair.tycoon.v11'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1' }
 signingConfigs { stable { storeFile rootProject.file('signing/game.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { debug { signingConfig signingConfigs.stable } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
